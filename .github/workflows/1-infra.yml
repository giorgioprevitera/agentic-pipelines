# =============================================================================
# Pipeline 1 — Infrastructure Provisioning
#
# Triggers:
#   - Push to main that changes infra/**
#   - Manual dispatch (for first run or forced apply)
#
# GitHub Secrets required:
#   AWS_ROLE_INFRA      — ARN from bootstrap outputs (plan+apply on main)
#   AWS_ROLE_INFRA_PLAN — ARN from bootstrap outputs (read-only, PRs only)
#   AWS_REGION          — e.g. eu-west-1
#   GEMINI_API_KEY      — from Google AI Studio (free tier)
# =============================================================================

name: 1 · Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/bootstrap/**" # bootstrap is run locally, not by CI
  pull_request:
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]

permissions:
  id-token: write # required for OIDC
  contents: read
  pull-requests: write # to post AI review comments

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VERSION: "1.9.0"

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # PRs get a read-only role (can plan, cannot apply); push/dispatch
          # on main get the full role. Least privilege: a PR should never be
          # able to touch real infrastructure.
          role-to-assume: ${{ github.event_name == 'pull_request' && secrets.AWS_ROLE_INFRA_PLAN || secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # wrapper interferes with output capture

      # ------------------------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # ------------------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # ------------------------------------------------------------------
      - name: Terraform Plan
        id: plan
        shell: bash # explicit shell enables pipefail, so a failed plan fails the step
        run: |
          terraform plan \
            -out=tfplan \
            -no-color \
            2>&1 | tee plan_output.txt

          # Save human-readable plan for AI review
          terraform show -no-color tfplan > plan_readable.txt

      # ------------------------------------------------------------------
      # 🤖 AI AGENT STEP — Terraform Plan Review
      # Phase 2 learning objective: fill in this step
      # ------------------------------------------------------------------
      - name: AI Agent · Review Terraform Plan
        id: ai_review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          REVIEW_JSON=$(../scripts/ask-gemini.sh ../prompts/plan-review.md plan_readable.txt | jq -c .)

          echo "review=$REVIEW_JSON" >> $GITHUB_OUTPUT

          SEVERITY=$(echo "$REVIEW_JSON" | jq -r '.severity')
          echo "severity=$SEVERITY" >> $GITHUB_OUTPUT

          # A failed agent call falls back to severity=LOW so it doesn't block
          # every apply on a flaky free-tier API — but that must never look
          # the same as "the AI reviewed this and found nothing." Surface it
          # as a loud annotation regardless of trigger type (push or PR).
          AGENT_ERROR=$(echo "$REVIEW_JSON" | jq -r '.agent_error // false')
          if [ "$AGENT_ERROR" = "true" ]; then
            REASON=$(echo "$REVIEW_JSON" | jq -r '.reason')
            echo "::warning::AI plan review did NOT run (agent_error) — proceeding WITHOUT review. Reason: $REASON"
          fi

          if [ "$SEVERITY" = "HIGH" ]; then
            echo "::error::AI review found HIGH severity issues — blocking apply"
            exit 1
          fi

      # ------------------------------------------------------------------
      - name: Post AI Review as PR Comment
        # !cancelled() runs this even after ai_review's exit 1 on HIGH severity
        # — the job still fails (blocking apply/merge), but you get the "why"
        # as a comment instead of having to dig through raw logs. Only an
        # actual workflow cancellation skips it.
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.ai_review.outputs.review }}
        with:
          script: |
            const review = JSON.parse(process.env.REVIEW);
            // Gemini's responseMimeType guarantees valid JSON, not this exact
            // shape — defend against a missing/malformed field rather than
            // letting the step crash on a schema drift.
            const severity = review.severity ?? 'UNKNOWN';
            const summary = review.summary ?? '_No summary provided._';
            const issues = Array.isArray(review.issues) ? review.issues : [];
            const heading = review.agent_error
              ? `## ⚠️ AI Review Unavailable\n\nThe AI agent call failed, so **this plan was not actually reviewed**. Reason: ${review.reason ?? 'unknown'}\n\n`
              : `## 🤖 Terraform Plan AI Review\n\n`;
            const body = heading +
              `**Severity:** ${severity}\n\n` +
              `**Summary:** ${summary}\n\n` +
              (issues.length
                ? `### Issues\n` + issues.map(i =>
                    `- **[${i.severity ?? '?'}]** \`${i.resource ?? '?'}\`: ${i.description ?? ''}`
                  ).join('\n')
                : '_No issues found._');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # ------------------------------------------------------------------
      # 🤖 AI AGENT STEP — Propose a fix for HIGH findings
      # Only runs on PRs, and only when a HIGH issue was found (ai_review
      # exited 1 in that case, so !cancelled() is required here too). Locates
      # each HIGH issue's resource in the .tf source via brace-matching, asks
      # Gemini for a corrected block, and posts the result as a PR *review*
      # (not just a comment) — nothing is applied automatically, you read the
      # suggestion and manually edit + push if you agree with it.
      # ------------------------------------------------------------------
      - name: AI Agent · Propose Fix for HIGH Findings
        id: ai_fix
        if: github.event_name == 'pull_request' && !cancelled() && steps.ai_review.outputs.severity == 'HIGH'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_JSON: ${{ steps.ai_review.outputs.review }}
        run: |
          # Given a resource address like "aws_security_group.web", find its
          # block in infra/*.tf via brace-counting and print it (or nothing
          # if not found — e.g. it's inside a module).
          find_resource_block() {
            local addr="$1"
            local type="${addr%%.*}"
            local name="${addr#*.}"
            name="${name%%\[*}" # strip a trailing [index] if present

            local f
            for f in ../infra/*.tf; do
              [ -f "$f" ] || continue
              if grep -qF "resource \"$type\" \"$name\" {" "$f"; then
                awk -v pat="resource \"$type\" \"$name\" {" '
                  index($0, pat) { start=1; depth=0 }
                  start {
                    depth += gsub(/{/, "{")
                    depth -= gsub(/}/, "}")
                    print
                    if (depth == 0) { exit }
                  }
                ' "$f"
                return 0
              fi
            done
            return 1
          }

          HIGH_ISSUES=$(echo "$REVIEW_JSON" | jq -c '[.issues[] | select(.severity == "HIGH")]')
          COUNT=$(echo "$HIGH_ISSUES" | jq 'length')

          : > fix_context.txt
          if [ "$COUNT" -eq 0 ]; then
            # Shouldn't happen if overall severity is HIGH, but never send an
            # empty prompt to the model.
            echo "No individual issues were marked HIGH despite overall severity HIGH." >> fix_context.txt
          else
            echo "$HIGH_ISSUES" | jq -c '.[]' | while IFS= read -r issue; do
              RESOURCE=$(echo "$issue" | jq -r '.resource')
              DESCRIPTION=$(echo "$issue" | jq -r '.description')

              {
                echo "### Issue: $RESOURCE"
                echo "Description: $DESCRIPTION"
                echo ""
                BLOCK=$(find_resource_block "$RESOURCE" || true)
                if [ -n "$BLOCK" ]; then
                  echo "Current Terraform source:"
                  echo '```hcl'
                  echo "$BLOCK"
                  echo '```'
                else
                  echo "Current Terraform source: NOT FOUND (resource may be inside a module or declared elsewhere)."
                fi
                echo ""
              } >> fix_context.txt
            done
          fi

          FIXES_JSON=$(../scripts/ask-gemini.sh ../prompts/plan-fix.md fix_context.txt | jq -c .)
          echo "fixes=$FIXES_JSON" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      - name: Post AI Fix Proposal as PR Review
        if: github.event_name == 'pull_request' && !cancelled() && steps.ai_review.outputs.severity == 'HIGH'
        uses: actions/github-script@v7
        env:
          FIXES: ${{ steps.ai_fix.outputs.fixes }}
        with:
          script: |
            let parsed;
            try {
              parsed = JSON.parse(process.env.FIXES);
            } catch (e) {
              parsed = { agent_error: true, reason: 'fix proposal output was not valid JSON' };
            }

            let body;
            if (parsed.agent_error) {
              body = `## ⚠️ AI Fix Proposal Unavailable\n\nCould not generate fix suggestions. Reason: ${parsed.reason ?? 'unknown'}`;
            } else {
              const fixes = Array.isArray(parsed.fixes) ? parsed.fixes : [];
              if (fixes.length === 0) {
                body = `## 🤖 AI Fix Proposal\n\nNo fixes were proposed for the HIGH findings above.`;
              } else {
                body = `## 🤖 AI Fix Proposal for HIGH Findings\n\n` +
                  `Nothing here is applied automatically — review each suggestion and manually edit + push if you agree.\n\n` +
                  fixes.map(f => {
                    const resource = f.resource ?? '?';
                    const explanation = f.explanation ?? '_no explanation provided_';
                    const hcl = f.proposed_hcl ?? '';
                    const codeBlock = hcl
                      ? `\`\`\`hcl\n${hcl}\n\`\`\``
                      : '_No precise fix could be generated for this resource — see explanation above._';
                    return `### \`${resource}\`\n${explanation}\n\n${codeBlock}`;
                  }).join('\n\n---\n\n');
              }
            }

            // A formal review (not just a comment) — shows up under the PR's
            // "Reviews" section. COMMENT, not APPROVE: this never approves
            // the PR on your behalf, it only proposes.
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'COMMENT',
              body
            });

      # ------------------------------------------------------------------
      - name: Terraform Apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: echo terraform apply -auto-approve tfplan
